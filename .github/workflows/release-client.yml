name: Release Client

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-client:
    name: Publish private-api-client to GitHub Packages
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Compute release version
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z format. Got: $tag" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Publish client artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon :private-api-client:publish -Pversion=${{ steps.version.outputs.value }}
